<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Zero Trust · Mental Model Map</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --bg-alt: #161b22;
    --bg-elev: #1c2128;
    --border: #30363d;
    --border-soft: #21262d;
    --text: #c9d1d9;
    --text-strong: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --gold: #f1c40f;
    --warn: #f59e0b;
    --focus: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    font-size: 15px; line-height: 1.65; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .app {
    display:grid; grid-template-columns: 1fr 420px;
    grid-template-rows: 44px 1fr;
    grid-template-areas: "nav nav" "viz side";
    height:100vh; width:100vw;
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 44px 55vh 1fr;
           grid-template-areas: "nav" "viz" "side"; }
  }

  /* Sticky mini nav */
  .mininav {
    grid-area: nav;
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 16px;
    background: rgba(13,17,23,0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
    font-size: 14px;
  }
  .mininav .title { color: var(--text-strong); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: center; }
  .mininav a, .mininav button {
    color: var(--text); background: transparent; border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; text-decoration: none;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .mininav a:hover, .mininav button:hover { border-color: var(--accent); color: var(--text-strong); }

  .viz { grid-area: viz; position:relative; overflow:hidden; background:
      radial-gradient(ellipse at center, #111827 0%, #0d1117 70%); }
  .viz svg { width:100%; height:100%; display:block; cursor: grab; }
  .viz svg:active { cursor: grabbing; }

  .toolbar {
    position:absolute; top:12px; left:12px; display:flex; gap:8px; flex-wrap:wrap; z-index:5;
  }
  .toolbar button, .legend-chip {
    background: rgba(22,27,34,0.85); color:var(--text); border:1px solid var(--border);
    padding:6px 10px; border-radius:6px; font-size:12px; cursor:pointer;
    backdrop-filter: blur(6px); font-family: inherit;
  }
  .toolbar button:hover { border-color: var(--accent); color: var(--text-strong); }

  .legend {
    position:absolute; bottom:12px; left:12px; display:flex; gap:6px; flex-wrap:wrap; z-index:5;
  }
  .legend-chip { display:flex; align-items:center; gap:6px; font-size:12px; cursor:default; }
  .legend-chip .dot { width:10px; height:10px; border-radius:50%; }

  .sidebar {
    grid-area: side;
    background: var(--bg-alt); border-left:1px solid var(--border);
    padding: 24px 22px; overflow-y:auto;
  }
  @media (max-width: 900px) {
    .sidebar { border-left:none; border-top:1px solid var(--border); }
  }
  .sidebar > * { max-width: 66ch; }
  .sidebar h1 { font-size: 24px; line-height: 1.25; margin: 0 0 10px; color: var(--gold); }

  /* Definition — promoted to the top */
  .definition {
    color: var(--text-strong); font-size: 15px; line-height: 1.65;
    margin: 0 0 16px;
  }

  /* Mantra — non-italic, white, accent left border (no italics on dark) */
  .mantra {
    font-style: normal; color: var(--text-strong); font-weight: 500;
    font-size: 15px; line-height: 1.5;
    margin: 0 0 20px;
    padding: 10px 14px;
    border-left: 3px solid var(--gold);
    background: rgba(241,196,15,0.06);
    border-radius: 0 4px 4px 0;
  }

  /* Section headings — 13px, bumped contrast, divider above */
  .sidebar section { padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--border); }
  .sidebar section:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .sidebar h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-strong); margin: 0 0 10px; font-weight: 600;
  }
  .sidebar ul { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.65; color: var(--text); }
  .sidebar li { margin-bottom: 6px; }
  .sidebar li::marker { color: var(--text-dim); }

  /* Collapsible for long sections */
  details.collapsible { margin: 0; }
  details.collapsible > summary {
    cursor: pointer; list-style: none;
    font-size: 13px; color: var(--accent); margin-top: 8px;
    padding: 4px 0;
  }
  details.collapsible > summary::-webkit-details-marker { display: none; }
  details.collapsible > summary::before { content: "▸ "; display: inline-block; transition: transform 0.15s; }
  details.collapsible[open] > summary::before { transform: rotate(90deg); }

  .tradeoff {
    background: #3d2a14; border-left: 3px solid var(--warn); color: #fde7bf;
    padding: 12px 14px; border-radius: 0 4px 4px 0;
    font-size: 15px; line-height: 1.6;
  }

  .detail-card {
    margin-top: 18px; padding: 14px; border:1px solid var(--border); border-radius:6px;
    background: var(--bg); font-size: 15px; line-height: 1.6; color: var(--text);
  }
  .detail-card .cat {
    display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    padding: 3px 10px; border-radius: 10px; background: var(--border-soft); margin-bottom:8px;
    font-weight: 600;
  }
  .detail-card h3 { margin: 4px 0 8px; font-size: 17px; color: var(--text-strong); }
  .detail-card .rels { margin-top:10px; font-size: 12px; color: var(--text-dim); }

  .link { fill:none; stroke-opacity:0.55; stroke-width:1.4px; }
  .node circle { stroke:#0d1117; stroke-width:2px; cursor:pointer;
    transition: r 0.2s ease, stroke-width 0.2s ease; }
  .node:hover circle { stroke:#fff; stroke-width:3px; }
  .node text { font-size:12px; fill: var(--text-strong); pointer-events:none;
    text-shadow: 0 0 4px #0d1117, 0 0 4px #0d1117; }
  .node.root text { font-size: 15px; font-weight: 600; fill: var(--gold); }
  .node.group text { font-weight: 600; font-size: 13px; }

  .tooltip {
    position:absolute; pointer-events:none; background: rgba(22,27,34,0.96);
    border:1px solid var(--border); border-radius:6px; padding:10px 12px;
    font-size:13px; max-width:300px; color:var(--text);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5); opacity:0; transition: opacity 0.15s;
    z-index: 10; line-height: 1.5;
  }
  .tooltip strong { color: var(--gold); }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .node circle { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="mininav" aria-label="Card navigation">
    <button type="button" onclick="history.back()" aria-label="Go back">← Back</button>
    <span class="title">Zero Trust</span>
    <a href="../../" aria-label="Home">Home</a>
    <a href="index.html" aria-label="All trees">All trees →</a>
  </nav>
  <div class="viz">
    <div class="toolbar">
      <button id="btn-reset">⟲ Reset view</button>
      <button id="btn-expand">⤢ Expand all</button>
      <button id="btn-collapse">⤡ Collapse</button>
    </div>
    <svg id="chart"></svg>
    <div class="legend" id="legend"></div>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <aside class="sidebar" aria-label="Card details">
    <h1>Zero Trust</h1>
    <p class="definition" id="definition"></p>
    <p class="mantra" id="mantra"></p>

    <section>
      <h2>When to apply</h2>
      <div id="when-wrap"></div>
    </section>

    <section>
      <h2>Without it</h2>
      <div id="without-wrap"></div>
    </section>

    <section>
      <h2>Key tradeoff</h2>
      <div class="tradeoff" id="tradeoff-box"></div>
    </section>

    <div id="detail-slot"></div>
  </aside>
</div>

<script>
const DATA = {"name": "Zero Trust", "category": "ROOT", "mantra": "Never trust, always verify—assume breach everywhere.", "description": "Zero Trust is a security model, strategy, and guiding principle that assumes a breached state and eliminates implicit trust across all layers of an application and network. It treats all processes, operations, and network requests—including internal traffic—as potential attack vectors, enforcing explicit, continuous verification of all available data points.\n\nCore principles of Zero Trust include explicit verification, least-privilege access, defense in depth, and deny-by-default access contr…", "children": [{"name": "Mental Models", "category": "MENTAL_MODEL", "isGroup": true, "children": [{"name": "Defense-In-Depth", "category": "MENTAL_MODEL", "description": "Defense-in-depth is a layered security approach applied to define and implement compensating mitigations for modeled threats. A security principle applied by using localized network controls at all available network boundaries.", "weight": 2.0, "relations": ["builds_on", "graph"]}, {"name": "Least-Privilege Access", "category": "MENTAL_MODEL", "description": "Least-privilege access limits permissions to the right identities, right set of permissions, right duration, and right assets. A Zero Trust principle that aims at minimizing a set of permissions to complete a job function.", "weight": 2.0, "relations": ["builds_on", "graph"]}, {"name": "Microsoft Zero Trust Model", "category": "MENTAL_MODEL", "description": "The Microsoft Zero Trust model is a security framework used as a compass to mitigate security risks in workload design.", "weight": 2.0, "relations": ["graph"]}]}, {"name": "Patterns", "category": "PATTERN", "isGroup": true, "children": [{"name": "Micro-Segmentation", "category": "PATTERN", "description": "A network security design pattern used to isolate and secure individual application workloads based on a Zero Trust model. A method of creating separate segments within a private network by grouping parts of a workload and establishing secure communication paths.", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Segmentation Strategy", "category": "PATTERN", "description": "Segmentation strategy is an architectural approach influenced by classification labels, including traffic isolation boundaries. A strategy to minimize network visibility by segmenting networks and starting with least-privilege network controls.", "weight": 2.0, "relations": ["builds_on", "graph"]}]}, {"name": "Azure Services", "category": "AZURE_SERVICE", "isGroup": true, "children": [{"name": "Network Security Groups", "category": "AZURE_SERVICE", "description": "Network Security Groups (NSGs) are Azure resources that function as Layer 3 and Layer 4 firewalls, filtering and controlling network traffic between resources in virtual networks and external networks. They are applied at the subnet or network interface (NIC) level, acting as perimeter traffic filters that use IP-based access control lists (ACLs) to secure ingress paths based on IP addresses, ports, and protocols. NSGs enable micro-segmentation of application traffic and enforcement of securi…", "weight": 3.0, "relations": ["enables", "graph"]}, {"name": "Azure Firewall", "category": "AZURE_SERVICE", "description": "Azure Firewall is a cloud-native, fully stateful, managed Platform-as-a-Service (PaaS) network security service in Microsoft Azure that provides centralized firewall protection for Azure workloads. It filters traffic between cloud resources, the internet, and on-premises networks, supporting both east-west and north-south traffic inspection. It operates as a network edge firewall, typically deployed in centralized hub network models for egress control, requiring a dedicated subnet and availab…", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Azure Virtual Desktop", "category": "AZURE_SERVICE", "description": "Azure Virtual Desktop (AVD) is a cloud-based desktop and application virtualization service that runs on Microsoft Azure, providing a managed Microsoft control plane for virtual desktop infrastructure. It enables organizations to deploy, manage, and maintain virtual desktop workloads, giving users access to their desktops and applications from anywhere, on any device. AVD supports Windows 10/11 Enterprise multi-session remote desktops and offers features like pooled resources, personal deskto…", "weight": 2.0, "relations": ["graph"]}, {"name": "Traffic Analytics", "category": "AZURE_SERVICE", "description": "Traffic Analytics is a feature of Azure Network Watcher that analyzes and enriches virtual network flow logs, including NSG flow logs, to provide continuous visibility into network traffic. It surfaces actionable insights such as blocked traffic, malicious flows, active ports, suspicious traffic patterns, top talkers, threats, and misconfigurations. Traffic Analytics also uncovers trends in bandwidth usage, traffic patterns, and user flow behavior, enabling comprehensive monitoring of both in…", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Azure Network Watcher", "category": "AZURE_SERVICE", "description": "Azure Network Watcher is an Azure service that provides comprehensive network monitoring, diagnostics, and management capabilities across Azure infrastructure. It serves as a suite of tools for tracking network connectivity, performance, security, and compliance, and can be used in combination with Azure Monitor for enhanced network monitoring.\n\nA key feature of Azure Network Watcher is Connection Monitor, which validates network connectivity scenarios, performs automated connectivity testing…", "weight": 1.0, "relations": ["graph"]}, {"name": "Virtual WAN", "category": "AZURE_SERVICE", "description": "Virtual WAN is an Azure networking service that provides hub-based connectivity infrastructure for wide-area network architectures. It supports hub-and-spoke network topologies with features including VPN gateways (such as S2S VPN), ExpressRoute gateways, hub routers, and comprehensive routing capabilities including routing intent and policies for traffic redirection.\n\nVirtual WAN offers connectivity, security, routing, and monitoring capabilities, along with cost optimization and multiregion…", "weight": 1.0, "relations": ["graph"]}]}, {"name": "Processes", "category": "PROCESS", "isGroup": true, "children": [{"name": "Security Readiness Plan", "category": "PROCESS", "description": "A security readiness plan is aligned with business priorities and provides well-defined processes, adequate investments, and appropriate accountabilities for protecting assets.", "weight": 2.0, "relations": ["enables", "graph"]}]}, {"name": "Concepts", "category": "CONCEPT", "isGroup": true, "children": [{"name": "Mission-Critical Workloads", "category": "CONCEPT", "description": "Mission-Critical Workloads are applications and systems that require the highest levels of reliability, availability, fault tolerance, and performance. They are significant in scale and complexity, and their architecture varies based on business requirements and acceptable downtime levels.\n\nOn Azure, mission-critical workloads are designed to maximize reliability, with baseline architectures recommending containerization and container orchestrators for application deployment. For the highest…", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Network Filtering", "category": "CONCEPT", "description": "Network filtering is a mechanism that allows or blocks network traffic based on specified rules, verifying that traffic entering a boundary is expected, allowed, and safe.", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Network Perimeter", "category": "CONCEPT", "description": "A security boundary that augments identity controls by controlling blast radius, blocking unsafe access, and obfuscating workload resources. The network perimeter establishes the security boundary between an application and other networks, distinguishing ingress, internal, and egress traffic.", "weight": 2.0, "relations": ["builds_on", "graph"]}, {"name": "Security", "category": "CONCEPT", "description": "Security is one of the five mission-critical design principles and workload quality pillars within the Azure Well-Architected Framework, focused on providing confidentiality, integrity, and availability assurances for workload systems and user data. It addresses the protection of workloads against threats intended to directly or indirectly compromise their reliability, requiring controls for both software development and operational components.\n\nSecurity covers a broad range of areas includin…", "weight": 2.0, "relations": ["builds_on", "graph"]}, {"name": "Internal Traffic", "category": "CONCEPT", "description": "Internal traffic flows between components within a network and should be secured to prevent malicious access.", "weight": 1.0, "relations": ["graph"]}, {"name": "Preshared Keys", "category": "CONCEPT", "description": "Distinct keys created for each consumer to control access, enabling independent revocation and rotation. Preshared keys are a type of secret shared between a provider and consumer used through a secure and agreed upon mechanism.", "weight": 1.0, "relations": ["graph"]}]}, {"name": "Other", "category": "OTHER", "isGroup": true, "children": [{"name": "Microsoft", "category": "OTHER", "description": "Microsoft is a major technology company founded in 1975 and the parent company of Azure. Its cloud ecosystem encompasses Azure, Dynamics 365, Microsoft 365, Power Platform, and Fabric. Microsoft manages Azure infrastructure including data synchronization, traffic distribution, failover capabilities, serverless compute options, and DDoS L3/L4 protection. The company publishes SLAs for uptime and connectivity, RTO and RPO recovery guarantees, and offers discounted rates through various licensin…", "weight": 1.0, "relations": ["graph"]}]}]};
const CARD = {"name": "Zero Trust", "mantra": "Never trust, always verify—assume breach everywhere.", "layer": "security", "when_to_apply": ["Designing network security for cloud workloads", "Handling internal east-west traffic between services", "Architecting mission-critical systems", "Establishing access controls for sensitive resources", "Building a security readiness plan"], "without_it": ["Lateral movement after a single breach", "Over-trusted internal traffic becomes attack vector", "Implicit access grants expose sensitive data", "Flat networks with no segmentation", "Delayed breach detection due to lack of continuous verification"], "key_tradeoff": "Stronger security posture at the cost of increased complexity, latency from continuous verification, and operational overhead.", "builds_on": ["Defense-In-Depth", "Least-Privilege Access", "Network Perimeter", "Security", "Segmentation Strategy"], "enables": ["Micro-Segmentation", "Network Security Groups", "Azure Firewall", "Mission-Critical Workloads", "Security Readiness Plan", "Traffic Analytics", "Network Filtering"], "connections": 19};
const COLORS = {"MENTAL_MODEL": "#f1c40f", "PATTERN": "#3b82f6", "AZURE_SERVICE": "#6366f1", "PROCESS": "#22c55e", "CONCEPT": "#9ca3af", "METRIC": "#ef4444", "OTHER": "#64748b", "ROOT": "#f1c40f"};

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Definition at the top (promoted from bottom)
const defEl = document.getElementById('definition');
const defText = DATA.description || '';
if (defText) { defEl.textContent = defText; } else { defEl.remove(); }

// Mantra — non-italic, accent border
const mantraEl = document.getElementById('mantra');
if (CARD.mantra) { mantraEl.textContent = '\u201C' + CARD.mantra + '\u201D'; }
else { mantraEl.remove(); }

// Render a list, collapsing behind <details> if > 4 items
function renderList(items, container, summaryLabel) {
  if (!items || !items.length) { container.textContent = '—'; return; }
  const listHtml = '<ul>' + items.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
  if (items.length > 4) {
    const first = items.slice(0, 3);
    const rest = items.slice(3);
    container.innerHTML =
      '<ul>' + first.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>' +
      `<details class="collapsible"><summary>Show ${rest.length} more</summary>` +
      '<ul>' + rest.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>' +
      '</details>';
  } else {
    container.innerHTML = listHtml;
  }
}

renderList(CARD.when_to_apply || [], document.getElementById('when-wrap'));
renderList(CARD.without_it || [], document.getElementById('without-wrap'));
document.getElementById('tradeoff-box').textContent = CARD.key_tradeoff || '—';

// Legend
const catsUsed = new Set();
(function collect(n){ if(n.category) catsUsed.add(n.category); (n.children||[]).forEach(collect); })(DATA);
const legendEl = document.getElementById('legend');
['MENTAL_MODEL','PATTERN','AZURE_SERVICE','PROCESS','CONCEPT','METRIC','OTHER']
  .filter(c => catsUsed.has(c))
  .forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'legend-chip';
    chip.innerHTML = `<span class="dot" style="background:${COLORS[c]}"></span>${c.replace('_',' ')}`;
    legendEl.appendChild(chip);
  });

const svg = d3.select('#chart');
const tooltip = d3.select('#tooltip');
const container = svg.append('g');

const zoom = d3.zoom().scaleExtent([0.3, 3])
  .on('zoom', e => container.attr('transform', e.transform));
svg.call(zoom);

const root = d3.hierarchy(DATA);
// Track collapsed state
root.descendants().forEach(d => { d._children = d.children; });

function radius() {
  const r = svg.node().getBoundingClientRect();
  return Math.max(220, Math.min(r.width, r.height) / 2 - 60);
}

let currentRoot = root;

function centerTransform() {
  const bbox = svg.node().getBoundingClientRect();
  return d3.zoomIdentity.translate(bbox.width / 2, bbox.height / 2);
}

function render() {
  const R = radius();
  const treeLayout = d3.cluster().size([2 * Math.PI, R])
    .separation((a, b) => (a.parent === b.parent ? 1 : 2) / Math.max(a.depth, 1));
  treeLayout(currentRoot);

  // Center via zoom transform so reset works correctly
  svg.call(zoom.transform, centerTransform());

  // Links
  const linkGen = d3.linkRadial().angle(d => d.x).radius(d => d.y);
  const links = container.selectAll('path.link').data(currentRoot.links(), d => d.target.data.name);
  links.exit().remove();
  links.enter().append('path').attr('class','link')
    .merge(links)
    .attr('stroke', d => COLORS[d.target.data.category] || COLORS.OTHER)
    .attr('d', linkGen);

  // Nodes
  const nodes = container.selectAll('g.node').data(currentRoot.descendants(), d => d.data.name + d.depth);
  nodes.exit().remove();
  const nodesEnter = nodes.enter().append('g')
    .attr('class', d => 'node' + (d.depth===0?' root':'') + (d.data.isGroup?' group':''));
  nodesEnter.append('circle');
  nodesEnter.append('text');

  const all = nodesEnter.merge(nodes);
  all.attr('transform', d =>
    `translate(${Math.sin(d.x) * d.y},${-Math.cos(d.x) * d.y})`);

  all.select('circle')
    .attr('r', d => d.depth === 0 ? 14 : d.data.isGroup ? 8 : 5 + Math.min(4, (d.data.weight||1)))
    .attr('fill', d => d.depth === 0 ? COLORS.ROOT || '#f1c40f' : COLORS[d.data.category] || COLORS.OTHER)
    .on('mouseenter', (e,d) => showTooltip(e,d))
    .on('mousemove', (e,d) => moveTooltip(e))
    .on('mouseleave', hideTooltip)
    .on('click', (e,d) => onClick(e,d));

  all.select('text')
    .attr('dy', '0.32em')
    .attr('x', d => d.x < Math.PI ? 10 : -10)
    .attr('text-anchor', d => d.x < Math.PI ? 'start' : 'end')
    .attr('transform', d => {
      const deg = (d.x * 180 / Math.PI) - 90;
      return d.x < Math.PI ? `rotate(${deg})` : `rotate(${deg+180})`;
    })
    .text(d => d.data.name);
}

function onClick(event, d) {
  if (d.data.isGroup || d.depth === 0) {
    // toggle collapse
    if (d.children) { d._kids = d.children; d.children = null; }
    else if (d._kids) { d.children = d._kids; d._kids = null; }
    render();
    return;
  }
  showDetail(d.data);
}

function showDetail(data) {
  const slot = document.getElementById('detail-slot');
  const rels = (data.relations && data.relations.length)
    ? `<div class="rels">Linked via: ${data.relations.map(escapeHtml).join(', ')}</div>` : '';
  slot.innerHTML = `
    <div class="detail-card" style="border-left:3px solid ${COLORS[data.category]||COLORS.OTHER}">
      <span class="cat" style="color:${COLORS[data.category]||COLORS.OTHER}">${(data.category||'').replace('_',' ')}</span>
      <h3>${escapeHtml(data.name)}</h3>
      <div>${escapeHtml(data.description || 'No description available.')}</div>
      ${rels}
    </div>`;
  slot.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function showTooltip(e, d) {
  const desc = d.data.description || d.data.mantra || '';
  tooltip.html(`<strong>${escapeHtml(d.data.name)}</strong>` +
    (desc ? `<br/><span>${escapeHtml(desc.slice(0,180))}${desc.length>180?'…':''}</span>` : ''))
    .style('opacity', 1);
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style('left', (e.clientX + 14) + 'px').style('top', (e.clientY + 14) + 'px');
}
function hideTooltip() { tooltip.style('opacity', 0); }

document.getElementById('btn-reset').onclick = () => {
  svg.transition().duration(500).call(zoom.transform, centerTransform());
};
document.getElementById('btn-expand').onclick = () => {
  root.descendants().forEach(d => { if (d._kids) { d.children = d._kids; d._kids = null; } });
  render();
};
document.getElementById('btn-collapse').onclick = () => {
  root.descendants().forEach(d => {
    if (d.depth >= 1 && d.children) { d._kids = d.children; d.children = null; }
  });
  render();
};

window.addEventListener('resize', render);
render();
</script>
</body>
</html>
