<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph · Mental Models · Azure WAF</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #f59e0b;
      --accent-2: #6366f1;
      --link: #58a6ff;
      --mm: #f59e0b;
      --pattern: #3b82f6;
      --service: #6366f1;
      --process: #22c55e;
      --concept: #9ca3af;
      --metric: #ef4444;
      --tradeoff: #a855f7;
      --anti: #e11d48;
      --other: #64748b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.65; }
    body { display: grid; grid-template-rows: 48px 1fr; grid-template-columns: 1fr 400px; grid-template-areas: "toolbar toolbar" "graph sidebar"; }

    header#toolbar { grid-area: toolbar; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border); min-height: 48px; }
    header#toolbar a.home { color: var(--muted); text-decoration: none; font-size: 0.9rem; padding: 6px 10px; border-radius: 6px; }
    header#toolbar a.home:hover { color: var(--text); background: var(--surface-2); }
    header#toolbar input#search { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; font-size: 0.95rem; border-radius: 6px; min-width: 240px; }
    header#toolbar input#search:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    header#toolbar nav { display: flex; gap: 4px; }
    header#toolbar nav button { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; cursor: pointer; }
    header#toolbar nav button:hover { color: var(--text); }
    header#toolbar nav button.active { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
    header#toolbar .edge-toggle { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 6px 10px; font-size: 0.8rem; border-radius: 6px; cursor: pointer; font-family: inherit; }
    header#toolbar .edge-toggle:hover { color: var(--text); }
    header#toolbar .edge-toggle.on { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
    header#toolbar .spacer { flex: 1; }
    header#toolbar .fps { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
    header#toolbar #breadcrumb { display: flex; gap: 4px; align-items: center; overflow-x: auto; max-width: 40vw; font-size: 0.85rem; color: var(--muted); }
    header#toolbar #breadcrumb button { background: transparent; color: var(--link); border: none; cursor: pointer; padding: 2px 4px; font-size: 0.85rem; }
    header#toolbar #breadcrumb button:hover { text-decoration: underline; }
    header#toolbar #breadcrumb .sep { color: var(--border); }

    main#graph-area { grid-area: graph; position: relative; overflow: hidden; background: var(--bg); }
    main#graph-area canvas, main#graph-area svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
    main#graph-area svg.overlay { pointer-events: none; }
    main#graph-area svg.overlay text { fill: var(--text); font-size: 12px; font-family: inherit; paint-order: stroke; stroke: #0d1117; stroke-width: 3px; stroke-linejoin: round; }
    main#graph-area svg.overlay text.mm { fill: var(--accent); font-weight: 600; }
    main#graph-area .hint { position: absolute; top: 12px; left: 12px; color: var(--muted); font-size: 0.82rem; background: rgba(22,27,34,0.9); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); pointer-events: none; }
    main#graph-area .hint kbd { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-family: ui-monospace, monospace; font-size: 0.78rem; }
    main#graph-area .legend { position: absolute; bottom: 12px; left: 12px; background: rgba(22,27,34,0.92); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.78rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; max-width: 520px; }
    main#graph-area .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

    aside#sidebar { grid-area: sidebar; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 24px; }
    aside#sidebar .empty { color: var(--muted); padding: 32px 8px; text-align: center; }
    aside#sidebar header.card { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    aside#sidebar header.card svg { width: 26px; height: 26px; flex: none; }
    aside#sidebar header.card h2 { margin: 0; font-size: 1.45rem; line-height: 1.2; letter-spacing: -0.01em; flex: 1; }
    aside#sidebar .pill { display: inline-block; background: var(--surface-2); border: 1px solid var(--border); padding: 2px 8px; font-size: 0.72rem; border-radius: 999px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    aside#sidebar blockquote { margin: 8px 0 18px; padding: 10px 14px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 6px; font-style: normal; color: var(--text); font-size: 1rem; }
    aside#sidebar .desc { color: var(--muted); margin: 0 0 18px; }
    aside#sidebar section { margin: 0 0 18px; padding: 0; }
    aside#sidebar section h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
    aside#sidebar section ul { margin: 0; padding-left: 18px; }
    aside#sidebar section ul li { margin: 3px 0; }
    aside#sidebar .tradeoff { background: var(--surface-2); border-left: 3px solid var(--tradeoff); padding: 10px 12px; border-radius: 6px; color: var(--text); font-size: 0.95rem; }
    aside#sidebar .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    aside#sidebar .chips button { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); padding: 5px 10px; border-radius: 999px; font-size: 0.85rem; cursor: pointer; font-family: inherit; text-align: left; }
    aside#sidebar .chips button:hover { border-color: var(--accent); color: var(--accent); }
    aside#sidebar .chips button.mm { border-left: 3px solid var(--accent); }
    aside#sidebar .chips button.pattern { border-left: 3px solid var(--pattern); }
    aside#sidebar .chips button.service { border-left: 3px solid var(--service); }
    aside#sidebar .chips button.missing { opacity: 0.55; cursor: not-allowed; border-style: dashed; }
    aside#sidebar .sources a { display: block; color: var(--link); text-decoration: none; padding: 6px 10px; border: 1px solid var(--border); border-left: 3px solid var(--accent-2); border-radius: 6px; margin-bottom: 6px; font-size: 0.9rem; }
    aside#sidebar .sources a:hover { background: var(--surface-2); }
    aside#sidebar .sources a small { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
    aside#sidebar footer.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); }
    aside#sidebar footer.nav button { flex: 1; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
    aside#sidebar footer.nav button:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; grid-template-rows: 48px 60vh 40vh; grid-template-areas: "toolbar" "graph" "sidebar"; }
      aside#sidebar { border-left: none; border-top: 1px solid var(--border); }
      header#toolbar #breadcrumb { display: none; }
    }
  </style>
</head>
<body>

<header id="toolbar">
  <a class="home" href="index.html">← Home</a>
  <input id="search" placeholder="Search… (/)" autocomplete="off" />
  <nav id="filters" role="group" aria-label="filters">
    <button data-f="mental">Mental Models</button>
    <button data-f="patterns">Patterns + Services</button>
    <button data-f="all" class="active">Everything</button>
  </nav>
  <button id="edgeToggle" class="edge-toggle" title="Toggle all 'mentioned_with' edges (may slow rendering)">All edges</button>
  <div id="breadcrumb" aria-label="path"></div>
  <div class="spacer"></div>
  <span class="fps" id="fps" title="frames per second"></span>
</header>

<main id="graph-area">
  <canvas id="graph"></canvas>
  <svg class="overlay" id="overlay"></svg>
  <div class="hint">
    Scroll to zoom · drag to pan · <kbd>/</kbd> search · <kbd>←</kbd>/<kbd>→</kbd> next model · <kbd>Esc</kbd> clear
  </div>
  <div class="legend" id="legend"></div>
</main>

<aside id="sidebar"><div class="empty">Select a node to see details.<br /><small>Tip: hover in the graph to preview.</small></div></aside>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
(() => {
"use strict";

// ─── constants ────────────────────────────────────────────────────────────
const TYPE_COLORS = {
  MENTAL_MODEL:"#f59e0b", PATTERN:"#3b82f6", AZURE_SERVICE:"#6366f1",
  PROCESS:"#22c55e", CONCEPT:"#9ca3af", METRIC:"#ef4444",
  ANTI_PATTERN:"#e11d48", TRADEOFF:"#a855f7", OTHER:"#64748b",
};
const TYPE_LABELS = {
  MENTAL_MODEL:"Mental Model", PATTERN:"Pattern", AZURE_SERVICE:"Azure Service",
  PROCESS:"Process", CONCEPT:"Concept", METRIC:"Metric",
  ANTI_PATTERN:"Anti-pattern", TRADEOFF:"Tradeoff", OTHER:"Other",
};
// Lucide icon paths (24x24 viewBox, stroke-based). Sourced from lucide.dev (MIT).
const ICON_PATHS = {
  MENTAL_MODEL: "M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 0 0 12 18Z M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 0 1 12 18Z M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4",
  PATTERN:      "M19.44 7.85a1 1 0 0 0 .29.88l1.57 1.57c.47.47.7 1.09.7 1.7s-.23 1.24-.7 1.71l-1.61 1.61a.98.98 0 0 1-.84.27c-.47-.07-.8-.48-.97-.92a2.5 2.5 0 1 0-3.21 3.21c.45.17.85.5.92.97a.98.98 0 0 1-.27.84l-1.61 1.61A2.4 2.4 0 0 1 12 22a2.4 2.4 0 0 1-1.7-.71l-1.57-1.57a1 1 0 0 0-.88-.29.97.97 0 0 0-1.02.97 2.5 2.5 0 1 1-3.23-3.24.97.97 0 0 0 .97-1.02 1 1 0 0 0-.29-.88l-1.57-1.57A2.4 2.4 0 0 1 2 12c0-.62.24-1.24.7-1.7l1.53-1.53a1 1 0 0 1 .92-.3c.51.08.87.53 1.07 1.01a2.5 2.5 0 1 0 3.26-3.26c-.48-.2-.93-.56-1.01-1.07a1 1 0 0 1 .3-.92l1.53-1.52A2.4 2.4 0 0 1 12 2a2.4 2.4 0 0 1 1.7.7l1.57 1.57a1 1 0 0 0 .88.3c.5-.08.84-.51 1.02-.97a2.5 2.5 0 1 1 3.24 3.23c-.47.18-.9.52-.97 1.02Z",
  AZURE_SERVICE:"M17.5 19a4.5 4.5 0 1 0-1.41-8.78 5.5 5.5 0 0 0-10.8 2.08A4 4 0 0 0 6 19h11.5Z",
  PROCESS:      "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M19.62 10.4l-1.1-2.65L20 6l-2-2-1.74 1.48-2.7-1.11L12.93 2h-1.95l-.63 2.4L7.7 5.52 6 4 4 6l1.45 1.79-1.08 2.66L2 11v2l2.4.66 1.12 2.64L4 18l2 2 1.8-1.46 2.6 1.07L11 22h2l.6-2.4 2.65-1.09c.45.13 1.75 1.3 1.75 1.3l2-2-1.48-1.75 1.1-2.65 2.38-.62v-2l-2.38-.58Z",
  CONCEPT:      "M9 18h6 M10 22h4 M15.1 14c.18-.98.65-1.74 1.4-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.6 4.6 0 0 1 8.9 14",
  METRIC:       "M22 12h-4l-3 9L9 3l-3 9H2",
  TRADEOFF:     "m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z M2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z M7 21h10 M12 3v18 M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2",
  ANTI_PATTERN: "m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z M12 9v4 M12 17h.01",
  OTHER:        "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z M12 8v4 M12 16h.01",
};
const ICON_PATH2D = {};
Object.entries(ICON_PATHS).forEach(([k, v]) => { try { ICON_PATH2D[k] = new Path2D(v); } catch (e) { ICON_PATH2D[k] = null; } });

const FILTERS = {
  mental:   n => n.type === "MENTAL_MODEL",
  patterns: n => n.type === "PATTERN" || n.type === "AZURE_SERVICE" || n.type === "MENTAL_MODEL",
  all:      _ => true,
};

const EDGE_COLORS = {
  builds_on:      "rgba(245,158,11,0.55)",
  enables:        "rgba(99,102,241,0.55)",
  mentioned_with: "rgba(139,148,158,0.18)",
};

// ─── state ────────────────────────────────────────────────────────────────
const state = {
  data: null,
  idx: new Map(),
  selected: null,
  hover: null,
  breadcrumb: [],
  filter: "all",
  search: "",
  modelOrder: [],
  transform: d3.zoomIdentity,
  showAllEdges: false,
  neighborsOf: new Map(),   // id -> Set(neighborId)  (undirected, all relations)
};
let visSet = new Set();
let visNodes = [];           // cached filtered node array
let visNodesDirty = true;    // recompute visSet/visNodes/quadtree on next render
let quadtree = null;         // d3.quadtree over visNodes (for fast hit-test)
let renderQueued = false;    // rAF dirty flag

// ─── DOM ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const sidebar = document.getElementById("sidebar");
const fpsEl = document.getElementById("fps");
const searchEl = document.getElementById("search");
const crumbEl = document.getElementById("breadcrumb");
const legendEl = document.getElementById("legend");

let W = 0, H = 0, DPR = Math.max(1, window.devicePixelRatio || 1);
function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  W = Math.max(300, rect.width);
  H = Math.max(300, rect.height);
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  overlay.setAttribute("viewBox", `0 0 ${W} ${H}`);
}
window.addEventListener("resize", () => { resize(); requestRender(); });

// ─── helpers ──────────────────────────────────────────────────────────────
function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
}[c])); }

function radius(n) {
  const base = n.type === "MENTAL_MODEL" ? 13 : (n.mission_critical ? 6 : 4);
  return base + Math.min(10, Math.sqrt(n.centrality || 0) * 0.9);
}

function nodeColor(n) { return TYPE_COLORS[n.type] || TYPE_COLORS.OTHER; }

function typeClass(n) {
  return n.type === "MENTAL_MODEL" ? "mm"
    : n.type === "PATTERN" ? "pattern"
    : n.type === "AZURE_SERVICE" ? "service"
    : "";
}

function visible(n) {
  if (!FILTERS[state.filter](n)) return false;
  const q = state.search.trim().toLowerCase();
  if (q && !n.id.toLowerCase().includes(q)) return false;
  return true;
}

// ─── init ─────────────────────────────────────────────────────────────────
async function init() {
  resize();
  try {
    const r = await fetch("./data/data.json");
    state.data = await r.json();
  } catch (e) {
    sidebar.innerHTML = `<div class="empty">Failed to load <code>data/data.json</code>.<br/><small>${esc(e.message)}</small></div>`;
    return;
  }

  // index by id; resolve edge endpoints to objects for the simulation
  state.data.nodes.forEach(n => { n.type = n.type || "OTHER"; state.idx.set(n.id, n); });
  const validEdges = [];
  for (const e of state.data.edges) {
    const s = state.idx.get(e.source), t = state.idx.get(e.target);
    if (!s || !t) continue;
    validEdges.push({ source: s, target: t, relation: e.relation, weight: e.weight });
  }
  state.data.edges = validEdges;

  // mental-model ordering for prev/next: layer → centrality desc
  state.modelOrder = state.data.nodes
    .filter(n => n.type === "MENTAL_MODEL" && (n.mantra || n.when_to_apply))
    .sort((a, b) =>
      (a.layer || "zz").localeCompare(b.layer || "zz")
      || (b.centrality || 0) - (a.centrality || 0)
      || a.id.localeCompare(b.id))
    .map(n => n.id);

  buildLegend();
  initPositions();
  bindUI();
  handleHash();
  invalidateVis();
  requestRender();
}

// ─── legend ───────────────────────────────────────────────────────────────
function buildLegend() {
  const counts = state.data.stats?.by_type || {};
  const types = Object.keys(TYPE_COLORS).filter(t => counts[t]);
  legendEl.innerHTML = types.map(t =>
    `<span><span class="dot" style="background:${TYPE_COLORS[t]}"></span>${TYPE_LABELS[t]} <small>(${counts[t]})</small></span>`
  ).join("");
}

// ─── layout (precomputed in build_data.py) ────────────────────────────────
function initPositions() {
  const nodes = state.data.nodes;
  const cx = W / 2, cy = H / 2;
  // fallback ring seed if data lacks x/y (older data.json)
  nodes.forEach((n, i) => {
    if (Number.isFinite(n.x) && Number.isFinite(n.y)) return;
    const ring = n.mission_critical ? 100 : 450;
    const a = (i / nodes.length) * Math.PI * 2 + (n.mission_critical ? 0 : Math.PI);
    n.x = cx + Math.cos(a) * ring;
    n.y = cy + Math.sin(a) * ring;
  });

  // neighbor index for fast focus-edge lookup and related-chip building
  const idx = state.neighborsOf;
  for (const n of nodes) idx.set(n.id, new Set());
  for (const e of state.data.edges) {
    idx.get(e.source.id)?.add(e.target.id);
    idx.get(e.target.id)?.add(e.source.id);
  }

  // center the world in the viewport on initial load
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const midX = (Math.min(...xs) + Math.max(...xs)) / 2;
  const midY = (Math.min(...ys) + Math.max(...ys)) / 2;
  const tx = W / 2 - midX, ty = H / 2 - midY;
  state.transform = d3.zoomIdentity.translate(tx, ty);
  d3.select(canvas).call(zoom.transform, state.transform);
}

// ─── zoom / pan / pick ────────────────────────────────────────────────────
const zoom = d3.zoom().scaleExtent([0.2, 6]).on("zoom", (ev) => {
  state.transform = ev.transform;
  requestRender();
});
d3.select(canvas).call(zoom);

function rebuildVis() {
  const nodes = state.data.nodes;
  visSet = new Set();
  visNodes = [];
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (visible(n)) { visSet.add(n.id); visNodes.push(n); }
  }
  quadtree = d3.quadtree()
    .x(d => d.x).y(d => d.y)
    .addAll(visNodes);
  visNodesDirty = false;
}
function invalidateVis() { visNodesDirty = true; }

function nodeAtPointer(x, y) {
  if (visNodesDirty) rebuildVis();
  if (!quadtree) return null;
  const [wx, wy] = state.transform.invert([x, y]);
  const searchR = 24 / state.transform.k;
  const n = quadtree.find(wx, wy, searchR);
  if (!n) return null;
  const r = radius(n) + 3;
  const dx = n.x - wx, dy = n.y - wy;
  return (dx * dx + dy * dy) <= r * r ? n : null;
}

canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const n = nodeAtPointer(e.clientX - rect.left, e.clientY - rect.top);
  const id = n ? n.id : null;
  if (id !== state.hover) { state.hover = id; canvas.style.cursor = id ? "pointer" : "default"; requestRender(); }
});
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const n = nodeAtPointer(e.clientX - rect.left, e.clientY - rect.top);
  if (n) selectNode(n.id, false);
});

// ─── render loop (canvas, dirty-flag + viewport culled) ─────────────────
let lastFrame = performance.now();
let frameTimes = [];

function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function render() {
  if (!state.data) return;
  if (visNodesDirty) rebuildVis();

  const t = state.transform;
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.translate(t.x, t.y);
  ctx.scale(t.k, t.k);

  // viewport in world coords (for culling)
  const pad = 40 / t.k;
  const xMin = (0 - t.x) / t.k - pad;
  const yMin = (0 - t.y) / t.k - pad;
  const xMax = (W - t.x) / t.k + pad;
  const yMax = (H - t.y) / t.k + pad;

  const selId = state.selected, hovId = state.hover;
  const emphIds = new Set();
  if (selId) emphIds.add(selId);
  if (hovId) emphIds.add(hovId);

  // ── edges ────────────────────────────────────────────────────────────
  ctx.lineCap = "round";
  const edges = state.data.edges;

  // 1) mentioned_with — only if user toggled "all edges" on
  if (state.showAllEdges) {
    ctx.lineWidth = 0.6 / t.k;
    ctx.strokeStyle = EDGE_COLORS.mentioned_with;
    ctx.beginPath();
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      if (e.relation !== "mentioned_with") continue;
      const s = e.source, d = e.target;
      if (!visSet.has(s.id) || !visSet.has(d.id)) continue;
      // cheap viewport cull: skip if both endpoints are outside
      if ((s.x < xMin && d.x < xMin) || (s.x > xMax && d.x > xMax) ||
          (s.y < yMin && d.y < yMin) || (s.y > yMax && d.y > yMax)) continue;
      ctx.moveTo(s.x, s.y); ctx.lineTo(d.x, d.y);
    }
    ctx.stroke();
  }

  // 2) semantic edges (builds_on / enables) — always drawn (only 250 total)
  for (const rel of ["builds_on", "enables"]) {
    ctx.strokeStyle = EDGE_COLORS[rel];
    ctx.lineWidth = 1.4 / t.k;
    ctx.beginPath();
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      if (e.relation !== rel) continue;
      const s = e.source, d = e.target;
      if (!visSet.has(s.id) || !visSet.has(d.id)) continue;
      if ((s.x < xMin && d.x < xMin) || (s.x > xMax && d.x > xMax) ||
          (s.y < yMin && d.y < yMin) || (s.y > yMax && d.y > yMax)) continue;
      ctx.moveTo(s.x, s.y); ctx.lineTo(d.x, d.y);
    }
    ctx.stroke();
  }

  // 3) focus edges — all edges touching selected/hovered, drawn on top
  if (emphIds.size) {
    ctx.strokeStyle = "rgba(245,158,11,0.9)";
    ctx.lineWidth = 1.6 / t.k;
    ctx.beginPath();
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      if (!emphIds.has(e.source.id) && !emphIds.has(e.target.id)) continue;
      const s = e.source, d = e.target;
      if (!visSet.has(s.id) || !visSet.has(d.id)) continue;
      ctx.moveTo(s.x, s.y); ctx.lineTo(d.x, d.y);
    }
    ctx.stroke();
  }

  // ── nodes (viewport culled) ──────────────────────────────────────────
  const showIconsLOD = t.k > 1.2;
  for (let i = 0; i < visNodes.length; i++) {
    const n = visNodes[i];
    if (n.x < xMin || n.x > xMax || n.y < yMin || n.y > yMax) continue;
    const r = radius(n);
    const isSel = n.id === selId;
    const isHov = n.id === hovId;

    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = nodeColor(n);
    ctx.fill();

    if (isSel) {
      ctx.lineWidth = 3 / t.k;
      ctx.strokeStyle = "#fff";
      ctx.stroke();
    } else if (isHov) {
      ctx.lineWidth = 2 / t.k;
      ctx.strokeStyle = "#fff";
      ctx.stroke();
    } else if (n.type === "MENTAL_MODEL") {
      ctx.lineWidth = 1.4 / t.k;
      ctx.strokeStyle = "#b8860b";
      ctx.stroke();
    } else {
      ctx.lineWidth = 0.6 / t.k;
      ctx.strokeStyle = "rgba(0,0,0,0.55)";
      ctx.stroke();
    }

    const iconPath = ICON_PATH2D[n.type] || ICON_PATH2D.OTHER;
    if (iconPath && (n.type === "MENTAL_MODEL" || showIconsLOD || r > 7)) {
      const iconSize = r * 1.25;
      ctx.save();
      ctx.translate(n.x - iconSize / 2, n.y - iconSize / 2);
      ctx.scale(iconSize / 24, iconSize / 24);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#fff";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.stroke(iconPath);
      ctx.restore();
    }
  }

  ctx.restore();

  renderLabels();

  const now = performance.now();
  frameTimes.push(now - lastFrame);
  if (frameTimes.length > 30) frameTimes.shift();
  lastFrame = now;
  const avg = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
  fpsEl.textContent = `${Math.round(1000 / avg)} fps · ${visNodes.length}/${state.data.nodes.length} nodes`;
}

function renderLabels() {
  const t = state.transform;
  const labels = [];
  const push = (n, emph) => {
    const x = n.x * t.k + t.x, y = n.y * t.k + t.y;
    if (x < -20 || y < -20 || x > W + 20 || y > H + 20) return;
    labels.push({ id: n.id, x, y: y - (radius(n) * t.k + 6), emph, mm: n.type === "MENTAL_MODEL" });
  };
  const seen = new Set();
  const add = (n, emph) => { if (n && !seen.has(n.id) && visSet.has(n.id)) { seen.add(n.id); push(n, emph); } };
  if (state.selected) add(state.idx.get(state.selected), true);
  if (state.hover)    add(state.idx.get(state.hover), true);
  // MMs when zoomed in (viewport-culled by push())
  if (t.k >= 0.9) {
    for (const n of state.data.nodes) if (n.type === "MENTAL_MODEL") add(n, false);
  }

  const parts = labels.map(l =>
    `<text x="${l.x.toFixed(1)}" y="${l.y.toFixed(1)}" text-anchor="middle" class="${l.mm ? "mm" : ""}">${esc(l.id)}</text>`
  );
  overlay.innerHTML = parts.join("");
}

// ─── selection / navigation ───────────────────────────────────────────────
function selectNode(id, pan) {
  const n = state.idx.get(id);
  if (!n) return;

  // bypass filter if needed
  if (!FILTERS[state.filter](n)) {
    state.filter = "all";
    document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("active", b.dataset.f === "all"));
    invalidateVis();
  }

  if (state.selected && state.selected !== id) {
    // Dedupe: remove any previous occurrence of this id, then append
    state.breadcrumb = state.breadcrumb.filter(b => b !== state.selected);
    state.breadcrumb.push(state.selected);
    if (state.breadcrumb.length > 8) state.breadcrumb.shift();
  }
  state.selected = id;
  try { history.replaceState(null, "", "#" + encodeURIComponent(id)); } catch (_) {}

  renderSidebar(n);
  renderBreadcrumb();
  if (pan) panTo(n);
  requestRender();
}

function panTo(n) {
  if (!Number.isFinite(n.x) || !Number.isFinite(n.y)) return;
  const targetK = Math.max(1.2, state.transform.k);
  const tx = W / 2 - n.x * targetK;
  const ty = H / 2 - n.y * targetK;
  d3.select(canvas).transition().duration(550)
    .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(targetK));
}

function prevNextModel(dir) {
  const order = state.modelOrder;
  if (!order.length) return;
  let i = state.selected ? order.indexOf(state.selected) : -1;
  i = (i + dir + order.length) % order.length;
  selectNode(order[i], true);
}

// ─── sidebar ──────────────────────────────────────────────────────────────
function renderSidebar(n) {
  if (!n) { sidebar.innerHTML = `<div class="empty">Select a node to see details.</div>`; return; }
  sidebar.innerHTML = (n.type === "MENTAL_MODEL" && (n.mantra || n.when_to_apply))
    ? mentalModelCard(n)
    : genericCard(n);

  sidebar.querySelectorAll("[data-goto]").forEach(el => {
    if (el.classList.contains("missing")) return;
    el.addEventListener("click", () => selectNode(el.dataset.goto, true));
  });
  const prev = sidebar.querySelector("#prev");
  const next = sidebar.querySelector("#next");
  if (prev) prev.addEventListener("click", () => prevNextModel(-1));
  if (next) next.addEventListener("click", () => prevNextModel(+1));
}

function iconSvg(n, size = 24) {
  const path = ICON_PATHS[n.type] || ICON_PATHS.OTHER;
  const color = nodeColor(n);
  // a single <path> treating whole string as path data works even with multiple M subpaths
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>`;
}

function chip(id) {
  const t = state.idx.get(id);
  if (!t) return `<button class="missing" title="not in graph" disabled>${esc(id)}</button>`;
  return `<button class="${typeClass(t)}" data-goto="${esc(id)}">${esc(id)}</button>`;
}

function section(title, items) {
  const arr = (items || []).filter(Boolean);
  if (!arr.length) return "";
  return `<section><h3>${title}</h3><ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>`;
}

function chipRow(title, ids) {
  const arr = (ids || []).filter(Boolean);
  if (!arr.length) return "";
  return `<section><h3>${title}</h3><div class="chips">${arr.map(chip).join("")}</div></section>`;
}

function relatedIdsFor(n) {
  // neighbors that are NOT already in builds_on/enables
  const already = new Set([...(n.builds_on || []), ...(n.enables || []), n.id]);
  const neighbors = new Map();
  for (const e of state.data.edges) {
    let other = null;
    if (e.source.id === n.id) other = e.target;
    else if (e.target.id === n.id) other = e.source;
    if (!other || already.has(other.id)) continue;
    const prev = neighbors.get(other.id) || { n: other, w: 0 };
    prev.w += (e.weight || 1) + (e.relation !== "mentioned_with" ? 5 : 0);
    neighbors.set(other.id, prev);
  }
  return [...neighbors.values()]
    .sort((a, b) => b.w - a.w)
    .slice(0, 14)
    .map(x => x.n.id);
}

function sourceDocsHtml(docs) {
  if (!docs || !docs.length) return "";
  return `<section class="sources"><h3>📄 Source docs</h3>${
    docs.map(d => `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title || d.path)}${
      d.section ? `<small>${esc(d.section)}</small>` : ""}</a>`).join("")
  }</section>`;
}

function mentalModelCard(n) {
  return `
    <header class="card">${iconSvg(n)}<h2>${esc(n.id)}</h2>${n.layer ? `<span class="pill">${esc(n.layer)}</span>` : ""}</header>
    ${n.mantra ? `<blockquote>“${esc(n.mantra)}”</blockquote>` : ""}
    ${n.description && !n.mantra ? `<p class="desc">${esc(n.description)}</p>` : ""}
    ${section("🎯 When to apply", n.when_to_apply)}
    ${section("💥 Without it", n.without_it)}
    ${n.key_tradeoff ? `<section><h3>⚖️ Key tradeoff</h3><div class="tradeoff">${esc(n.key_tradeoff)}</div></section>` : ""}
    ${chipRow("🔗 Builds on", n.builds_on)}
    ${chipRow("🔗 Enables", n.enables)}
    ${chipRow("📎 Related", relatedIdsFor(n))}
    ${sourceDocsHtml(n.source_docs)}
    <footer class="nav">
      <button id="prev">← prev model</button>
      <button id="next">next model →</button>
    </footer>`;
}

function genericCard(n) {
  const typeLabel = TYPE_LABELS[n.type] || n.type;
  return `
    <header class="card">${iconSvg(n)}<h2>${esc(n.id)}</h2><span class="pill">${esc(typeLabel)}</span></header>
    ${n.description ? `<p class="desc">${esc(n.description)}</p>` : ""}
    ${chipRow("📎 Connected to", relatedIdsFor(n))}
    ${sourceDocsHtml(n.source_docs)}`;
}

// ─── breadcrumb ───────────────────────────────────────────────────────────
function renderBreadcrumb() {
  const trail = [...state.breadcrumb];
  if (state.selected) trail.push(state.selected);
  // dedupe consecutive
  const dedup = [];
  for (const id of trail) if (dedup[dedup.length - 1] !== id) dedup.push(id);
  crumbEl.innerHTML = dedup.map((id, i) =>
    `${i ? '<span class="sep">›</span>' : ""}<button data-goto="${esc(id)}">${esc(id)}</button>`
  ).join("");
  crumbEl.querySelectorAll("[data-goto]").forEach(el =>
    el.addEventListener("click", () => selectNode(el.dataset.goto, true)));
}

// ─── UI wiring ────────────────────────────────────────────────────────────
function bindUI() {
  // filters
  const urlFilter = new URLSearchParams(location.search).get("filter");
  if (urlFilter && FILTERS[urlFilter]) state.filter = urlFilter;
  document.querySelectorAll("#filters button").forEach(b => {
    b.classList.toggle("active", b.dataset.f === state.filter);
    b.addEventListener("click", () => {
      state.filter = b.dataset.f;
      document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("active", x === b));
      invalidateVis();
      requestRender();
    });
  });

  // edge toggle
  const edgeBtn = document.getElementById("edgeToggle");
  const urlEdges = new URLSearchParams(location.search).get("edges");
  if (urlEdges === "all") state.showAllEdges = true;
  edgeBtn.classList.toggle("on", state.showAllEdges);
  edgeBtn.addEventListener("click", () => {
    state.showAllEdges = !state.showAllEdges;
    edgeBtn.classList.toggle("on", state.showAllEdges);
    requestRender();
  });

  // search
  searchEl.addEventListener("input", (e) => { state.search = e.target.value; invalidateVis(); requestRender(); });
  searchEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const q = state.search.trim().toLowerCase();
      if (!q) return;
      const hit = state.data.nodes.find(n => n.id.toLowerCase() === q)
               || state.data.nodes.find(n => n.id.toLowerCase().includes(q));
      if (hit) selectNode(hit.id, true);
    } else if (e.key === "Escape") {
      searchEl.blur();
    }
  });

  // keyboard
  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "/") { e.preventDefault(); searchEl.focus(); searchEl.select(); }
    else if (e.key === "Escape") { state.selected = null; state.hover = null; renderSidebar(null); renderBreadcrumb(); requestRender(); }
    else if (e.key === "ArrowRight") { prevNextModel(+1); }
    else if (e.key === "ArrowLeft")  { prevNextModel(-1); }
  });

  window.addEventListener("hashchange", handleHash);
}

// ─── hash routing ─────────────────────────────────────────────────────────
function handleHash() {
  let raw = location.hash.slice(1);
  if (!raw) return;
  let id;
  try { id = decodeURIComponent(raw); }
  catch (e) { console.warn("bad hash", raw, e); return; }
  if (!id) return;
  if (state.idx.has(id)) { selectNode(id, true); return; }
  // case-insensitive fallback
  const lc = id.toLowerCase();
  const hit = state.data.nodes.find(n => n.id.toLowerCase() === lc);
  if (hit) selectNode(hit.id, true);
}

init();
})();
</script>
</body>
</html>
