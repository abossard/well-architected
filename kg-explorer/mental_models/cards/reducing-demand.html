<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reducing Demand · Mental Model Map</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --bg-alt: #161b22;
    --bg-elev: #1c2128;
    --border: #30363d;
    --border-soft: #21262d;
    --text: #c9d1d9;
    --text-strong: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --gold: #f1c40f;
    --warn: #f59e0b;
    --focus: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    font-size: 15px; line-height: 1.65; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .app {
    display:grid; grid-template-columns: 1fr 420px;
    grid-template-rows: 44px 1fr;
    grid-template-areas: "nav nav" "viz side";
    height:100vh; width:100vw;
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 44px 55vh 1fr;
           grid-template-areas: "nav" "viz" "side"; }
  }

  /* Sticky mini nav */
  .mininav {
    grid-area: nav;
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 16px;
    background: rgba(13,17,23,0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
    font-size: 14px;
  }
  .mininav .title { color: var(--text-strong); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: center; }
  .mininav a, .mininav button {
    color: var(--text); background: transparent; border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; text-decoration: none;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .mininav a:hover, .mininav button:hover { border-color: var(--accent); color: var(--text-strong); }

  .viz { grid-area: viz; position:relative; overflow:hidden; background:
      radial-gradient(ellipse at center, #111827 0%, #0d1117 70%); }
  .viz svg { width:100%; height:100%; display:block; cursor: grab; }
  .viz svg:active { cursor: grabbing; }

  .toolbar {
    position:absolute; top:12px; left:12px; display:flex; gap:8px; flex-wrap:wrap; z-index:5;
  }
  .toolbar button, .legend-chip {
    background: rgba(22,27,34,0.85); color:var(--text); border:1px solid var(--border);
    padding:6px 10px; border-radius:6px; font-size:12px; cursor:pointer;
    backdrop-filter: blur(6px); font-family: inherit;
  }
  .toolbar button:hover { border-color: var(--accent); color: var(--text-strong); }

  .legend {
    position:absolute; bottom:12px; left:12px; display:flex; gap:6px; flex-wrap:wrap; z-index:5;
  }
  .legend-chip { display:flex; align-items:center; gap:6px; font-size:12px; cursor:default; }
  .legend-chip .dot { width:10px; height:10px; border-radius:50%; }

  .sidebar {
    grid-area: side;
    background: var(--bg-alt); border-left:1px solid var(--border);
    padding: 24px 22px; overflow-y:auto;
  }
  @media (max-width: 900px) {
    .sidebar { border-left:none; border-top:1px solid var(--border); }
  }
  .sidebar > * { max-width: 66ch; }
  .sidebar h1 { font-size: 24px; line-height: 1.25; margin: 0 0 10px; color: var(--gold); }

  /* Definition — promoted to the top */
  .definition {
    color: var(--text-strong); font-size: 15px; line-height: 1.65;
    margin: 0 0 16px;
  }

  /* Mantra — non-italic, white, accent left border (no italics on dark) */
  .mantra {
    font-style: normal; color: var(--text-strong); font-weight: 500;
    font-size: 15px; line-height: 1.5;
    margin: 0 0 20px;
    padding: 10px 14px;
    border-left: 3px solid var(--gold);
    background: rgba(241,196,15,0.06);
    border-radius: 0 4px 4px 0;
  }

  /* Section headings — 13px, bumped contrast, divider above */
  .sidebar section { padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--border); }
  .sidebar section:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .sidebar h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-strong); margin: 0 0 10px; font-weight: 600;
  }
  .sidebar ul { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.65; color: var(--text); }
  .sidebar li { margin-bottom: 6px; }
  .sidebar li::marker { color: var(--text-dim); }

  /* Collapsible for long sections */
  details.collapsible { margin: 0; }
  details.collapsible > summary {
    cursor: pointer; list-style: none;
    font-size: 13px; color: var(--accent); margin-top: 8px;
    padding: 4px 0;
  }
  details.collapsible > summary::-webkit-details-marker { display: none; }
  details.collapsible > summary::before { content: "▸ "; display: inline-block; transition: transform 0.15s; }
  details.collapsible[open] > summary::before { transform: rotate(90deg); }

  .tradeoff {
    background: #3d2a14; border-left: 3px solid var(--warn); color: #fde7bf;
    padding: 12px 14px; border-radius: 0 4px 4px 0;
    font-size: 15px; line-height: 1.6;
  }

  .detail-card {
    margin-top: 18px; padding: 14px; border:1px solid var(--border); border-radius:6px;
    background: var(--bg); font-size: 15px; line-height: 1.6; color: var(--text);
  }
  .detail-card .cat {
    display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    padding: 3px 10px; border-radius: 10px; background: var(--border-soft); margin-bottom:8px;
    font-weight: 600;
  }
  .detail-card h3 { margin: 4px 0 8px; font-size: 17px; color: var(--text-strong); }
  .detail-card .rels { margin-top:10px; font-size: 12px; color: var(--text-dim); }

  .link { fill:none; stroke-opacity:0.55; stroke-width:1.4px; }
  .node circle { stroke:#0d1117; stroke-width:2px; cursor:pointer;
    transition: r 0.2s ease, stroke-width 0.2s ease; }
  .node:hover circle { stroke:#fff; stroke-width:3px; }
  .node text { font-size:12px; fill: var(--text-strong); pointer-events:none;
    text-shadow: 0 0 4px #0d1117, 0 0 4px #0d1117; }
  .node.root text { font-size: 15px; font-weight: 600; fill: var(--gold); }
  .node.group text { font-weight: 600; font-size: 13px; }

  .tooltip {
    position:absolute; pointer-events:none; background: rgba(22,27,34,0.96);
    border:1px solid var(--border); border-radius:6px; padding:10px 12px;
    font-size:13px; max-width:300px; color:var(--text);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5); opacity:0; transition: opacity 0.15s;
    z-index: 10; line-height: 1.5;
  }
  .tooltip strong { color: var(--gold); }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .node circle { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="mininav" aria-label="Card navigation">
    <button type="button" onclick="history.back()" aria-label="Go back">← Back</button>
    <span class="title">Reducing Demand</span>
    <a href="../../" aria-label="Home">Home</a>
    <a href="index.html" aria-label="All trees">All trees →</a>
  </nav>
  <div class="viz">
    <div class="toolbar">
      <button id="btn-reset">⟲ Reset view</button>
      <button id="btn-expand">⤢ Expand all</button>
      <button id="btn-collapse">⤡ Collapse</button>
    </div>
    <svg id="chart"></svg>
    <div class="legend" id="legend"></div>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <aside class="sidebar" aria-label="Card details">
    <h1>Reducing Demand</h1>
    <p class="definition" id="definition"></p>
    <p class="mantra" id="mantra"></p>

    <section>
      <h2>When to apply</h2>
      <div id="when-wrap"></div>
    </section>

    <section>
      <h2>Without it</h2>
      <div id="without-wrap"></div>
    </section>

    <section>
      <h2>Key tradeoff</h2>
      <div class="tradeoff" id="tradeoff-box"></div>
    </section>

    <div id="detail-slot"></div>
  </aside>
</div>

<script>
const DATA = {"name": "Reducing Demand", "category": "ROOT", "mantra": "Use less so you need less—cut waste before adding capacity.", "description": "Reducing demand implements strategies to minimize resource utilization and avoid overprovisioning.", "children": [{"name": "Patterns", "category": "PATTERN", "isGroup": true, "children": [{"name": "Cache Aside", "category": "PATTERN", "description": "Cache aside pattern checks the cache for data before querying the persistent data store, reducing demand.", "weight": 2.0, "relations": ["builds_on", "graph"]}, {"name": "Competing Consumers", "category": "PATTERN", "description": "A design pattern applying distributed concurrent processing to handle queue items with dynamic scaling based on queue depth. Competing Consumers pattern applies distributed and concurrent processing to handle queue items, enabling scaling based on queue depth down to zero.", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Compute Resource Consolidation", "category": "PATTERN", "description": "A design pattern that optimizes compute resources by increasing density and combining workloads on shared infrastructure. A design pattern that optimizes compute resources by increasing density and combining multiple applications on shared infrastructure, simplifying management and observability.", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Deployment Stamps", "category": "PATTERN", "description": "Deployment Stamps are a design pattern consisting of repeatable, self-contained units that include all resources required to deliver a workload. Each stamp represents workload-level redundancy with isolated failure domains, enabling horizontal scaling by adding one or more scale units.\n\nThese stamps are regional scale units that can be deployed across multiple regions to maximize reliability and mitigate risk. The pattern releases specific versions of an application and infrastructure as cont…", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Gateway Offloading", "category": "PATTERN", "description": "Gateway Offloading is a design pattern that offloads request processing to a gateway device before and after forwarding requests to backend nodes. This approach centralizes functionality—such as security features like web application firewalls and TLS connections—reducing the complexity of application code and shifting per-node processing costs to a centralized processing model. By consolidating these responsibilities at the gateway level, organizations can use fewer resources per node and be…", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Queue-Based Load Leveling", "category": "PATTERN", "description": "A design pattern that introduces a buffer between consumers and requested resources to ensure consistent load levels through queued processing. Queue-Based Load Leveling buffers incoming requests in a queue to provide resilience against demand spikes.", "weight": 2.0, "relations": ["builds_on", "graph"]}, {"name": "Sharding", "category": "PATTERN", "description": "Sharding is a horizontal partitioning method that distributes data and processing across multiple identical structured databases, each holding a subset of the overall dataset while maintaining the same schema. It divides a large database into smaller, independently manageable units called shards, partitioning users, customers, or other data entities into approximately equal-sized buckets based on different application and data contexts.\n\nSharding directs load to specific logical destinations,…", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Static Content Hosting", "category": "PATTERN", "description": "Static Content Hosting optimizes delivery of static content using a dedicated hosting platform, offloading from the application platform. Static Content Hosting is a design pattern that optimizes delivery of static content by using a dedicated hosting platform, offloading responsibility from the application platform.", "weight": 2.0, "relations": ["builds_on", "graph"]}, {"name": "Throttling", "category": "PATTERN", "description": "Throttling is a design pattern that imposes limits on the rate or throughput of incoming requests to a resource or component. Its primary purposes include preventing resource exhaustion, supporting graceful degradation under heavy load, and mitigating congestion. Throttling controls resource consumption by deferring lower-priority operations when load thresholds are reached, helping avoid noisy neighbor scenarios and protecting against automated abuse.\n\nBy providing clear upper bounds on util…", "weight": 2.0, "relations": ["builds_on", "graph"]}, {"name": "Valet Key", "category": "PATTERN", "description": "Valet Key is an architecture design pattern that grants security-restricted access to a resource without using an intermediary resource to proxy the access, limiting access in both scope and duration. A pattern granting security-restricted, time-limited access to resources without intermediary proxies or long-lasting credentials.", "weight": 2.0, "relations": ["enables", "graph"]}, {"name": "Claim Check", "category": "PATTERN", "description": "A pattern separating sensitive data from messaging flow, keeping it in a secured data store with stricter authorization. A design pattern separating data from messaging flow to improve efficiency when handling large data payloads.", "weight": 1.0, "relations": ["graph"]}, {"name": "Publisher/Subscriber", "category": "PATTERN", "description": "Publisher/Subscriber decouples architecture components by replacing direct communication with an intermediate message broker or event bus. A pattern decoupling components via an intermediate message broker, introducing security segmentation between publishers and subscribers.", "weight": 1.0, "relations": ["graph"]}]}]};
const CARD = {"name": "Reducing Demand", "mantra": "Use less so you need less—cut waste before adding capacity.", "layer": "operational", "when_to_apply": ["Costs are climbing due to overprovisioned resources", "Traffic spikes threaten service stability", "Backend systems are saturated under peak load", "You want to optimize before scaling out"], "without_it": ["Unnecessary overprovisioning and inflated costs", "Cascading failures under unexpected load", "Poor response times from saturated backends", "Wasted compute on work that could be offloaded or cached"], "key_tradeoff": "Reducing demand adds architectural complexity (caching, queuing, offloading) in exchange for lower resource consumption and cost.", "builds_on": ["Cache Aside", "Throttling", "Queue-Based Load Leveling", "Static Content Hosting"], "enables": ["Competing Consumers", "Compute Resource Consolidation", "Deployment Stamps", "Sharding", "Gateway Offloading", "Valet Key"], "connections": 12};
const COLORS = {"MENTAL_MODEL": "#f1c40f", "PATTERN": "#3b82f6", "AZURE_SERVICE": "#6366f1", "PROCESS": "#22c55e", "CONCEPT": "#9ca3af", "METRIC": "#ef4444", "OTHER": "#64748b", "ROOT": "#f1c40f"};

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Definition at the top (promoted from bottom)
const defEl = document.getElementById('definition');
const defText = DATA.description || '';
if (defText) { defEl.textContent = defText; } else { defEl.remove(); }

// Mantra — non-italic, accent border
const mantraEl = document.getElementById('mantra');
if (CARD.mantra) { mantraEl.textContent = '\u201C' + CARD.mantra + '\u201D'; }
else { mantraEl.remove(); }

// Render a list, collapsing behind <details> if > 4 items
function renderList(items, container, summaryLabel) {
  if (!items || !items.length) { container.textContent = '—'; return; }
  const listHtml = '<ul>' + items.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>';
  if (items.length > 4) {
    const first = items.slice(0, 3);
    const rest = items.slice(3);
    container.innerHTML =
      '<ul>' + first.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>' +
      `<details class="collapsible"><summary>Show ${rest.length} more</summary>` +
      '<ul>' + rest.map(x => `<li>${escapeHtml(x)}</li>`).join('') + '</ul>' +
      '</details>';
  } else {
    container.innerHTML = listHtml;
  }
}

renderList(CARD.when_to_apply || [], document.getElementById('when-wrap'));
renderList(CARD.without_it || [], document.getElementById('without-wrap'));
document.getElementById('tradeoff-box').textContent = CARD.key_tradeoff || '—';

// Legend
const catsUsed = new Set();
(function collect(n){ if(n.category) catsUsed.add(n.category); (n.children||[]).forEach(collect); })(DATA);
const legendEl = document.getElementById('legend');
['MENTAL_MODEL','PATTERN','AZURE_SERVICE','PROCESS','CONCEPT','METRIC','OTHER']
  .filter(c => catsUsed.has(c))
  .forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'legend-chip';
    chip.innerHTML = `<span class="dot" style="background:${COLORS[c]}"></span>${c.replace('_',' ')}`;
    legendEl.appendChild(chip);
  });

const svg = d3.select('#chart');
const tooltip = d3.select('#tooltip');
const container = svg.append('g');

const zoom = d3.zoom().scaleExtent([0.3, 3])
  .on('zoom', e => container.attr('transform', e.transform));
svg.call(zoom);

const root = d3.hierarchy(DATA);
// Track collapsed state
root.descendants().forEach(d => { d._children = d.children; });

function radius() {
  const r = svg.node().getBoundingClientRect();
  return Math.max(220, Math.min(r.width, r.height) / 2 - 60);
}

let currentRoot = root;

function centerTransform() {
  const bbox = svg.node().getBoundingClientRect();
  return d3.zoomIdentity.translate(bbox.width / 2, bbox.height / 2);
}

function render() {
  const R = radius();
  const treeLayout = d3.cluster().size([2 * Math.PI, R])
    .separation((a, b) => (a.parent === b.parent ? 1 : 2) / Math.max(a.depth, 1));
  treeLayout(currentRoot);

  // Center via zoom transform so reset works correctly
  svg.call(zoom.transform, centerTransform());

  // Links
  const linkGen = d3.linkRadial().angle(d => d.x).radius(d => d.y);
  const links = container.selectAll('path.link').data(currentRoot.links(), d => d.target.data.name);
  links.exit().remove();
  links.enter().append('path').attr('class','link')
    .merge(links)
    .attr('stroke', d => COLORS[d.target.data.category] || COLORS.OTHER)
    .attr('d', linkGen);

  // Nodes
  const nodes = container.selectAll('g.node').data(currentRoot.descendants(), d => d.data.name + d.depth);
  nodes.exit().remove();
  const nodesEnter = nodes.enter().append('g')
    .attr('class', d => 'node' + (d.depth===0?' root':'') + (d.data.isGroup?' group':''));
  nodesEnter.append('circle');
  nodesEnter.append('text');

  const all = nodesEnter.merge(nodes);
  all.attr('transform', d =>
    `translate(${Math.sin(d.x) * d.y},${-Math.cos(d.x) * d.y})`);

  all.select('circle')
    .attr('r', d => d.depth === 0 ? 14 : d.data.isGroup ? 8 : 5 + Math.min(4, (d.data.weight||1)))
    .attr('fill', d => d.depth === 0 ? COLORS.ROOT || '#f1c40f' : COLORS[d.data.category] || COLORS.OTHER)
    .on('mouseenter', (e,d) => showTooltip(e,d))
    .on('mousemove', (e,d) => moveTooltip(e))
    .on('mouseleave', hideTooltip)
    .on('click', (e,d) => onClick(e,d));

  all.select('text')
    .attr('dy', '0.32em')
    .attr('x', d => d.x < Math.PI ? 10 : -10)
    .attr('text-anchor', d => d.x < Math.PI ? 'start' : 'end')
    .attr('transform', d => {
      const deg = (d.x * 180 / Math.PI) - 90;
      return d.x < Math.PI ? `rotate(${deg})` : `rotate(${deg+180})`;
    })
    .text(d => d.data.name);
}

function onClick(event, d) {
  if (d.data.isGroup || d.depth === 0) {
    // toggle collapse
    if (d.children) { d._kids = d.children; d.children = null; }
    else if (d._kids) { d.children = d._kids; d._kids = null; }
    render();
    return;
  }
  showDetail(d.data);
}

function showDetail(data) {
  const slot = document.getElementById('detail-slot');
  const rels = (data.relations && data.relations.length)
    ? `<div class="rels">Linked via: ${data.relations.map(escapeHtml).join(', ')}</div>` : '';
  slot.innerHTML = `
    <div class="detail-card" style="border-left:3px solid ${COLORS[data.category]||COLORS.OTHER}">
      <span class="cat" style="color:${COLORS[data.category]||COLORS.OTHER}">${(data.category||'').replace('_',' ')}</span>
      <h3>${escapeHtml(data.name)}</h3>
      <div>${escapeHtml(data.description || 'No description available.')}</div>
      ${rels}
    </div>`;
  slot.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function showTooltip(e, d) {
  const desc = d.data.description || d.data.mantra || '';
  tooltip.html(`<strong>${escapeHtml(d.data.name)}</strong>` +
    (desc ? `<br/><span>${escapeHtml(desc.slice(0,180))}${desc.length>180?'…':''}</span>` : ''))
    .style('opacity', 1);
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style('left', (e.clientX + 14) + 'px').style('top', (e.clientY + 14) + 'px');
}
function hideTooltip() { tooltip.style('opacity', 0); }

document.getElementById('btn-reset').onclick = () => {
  svg.transition().duration(500).call(zoom.transform, centerTransform());
};
document.getElementById('btn-expand').onclick = () => {
  root.descendants().forEach(d => { if (d._kids) { d.children = d._kids; d._kids = null; } });
  render();
};
document.getElementById('btn-collapse').onclick = () => {
  root.descendants().forEach(d => {
    if (d.depth >= 1 && d.children) { d._kids = d.children; d.children = null; }
  });
  render();
};

window.addEventListener('resize', render);
render();
</script>
</body>
</html>
